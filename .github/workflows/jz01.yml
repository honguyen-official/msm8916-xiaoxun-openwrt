name: OpenWrt Builder (JZ01)
on:
  repository_dispatch:
  workflow_dispatch:

env:
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Europe/Madrid

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        # FIX2 (2026-11-12): Sua lan 1 chua du. Log run #2 cho thay vong cho DNS
        # chay het 20/20 lan ma DNS khong len, va sau khi doi guong thi loi
        # chuyen sang 'archive.ubuntu.com' - tuc DNS cua may chu Azure khong
        # phan giai duoc ten mien Ubuntu (nhung github.com thi van phan giai
        # duoc, buoc Checkout chay binh thuong). Cach sua: doi may chu DNS
        # sang Google 8.8.8.8 + Cloudflare 1.1.1.1 ngay dau buoc.
        sudo rm -f /etc/resolv.conf
        printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' | sudo tee /etc/resolv.conf
        echo "resolv.conf hien tai:"; cat /etc/resolv.conf
        for i in $(seq 1 20); do
          if getent hosts archive.ubuntu.com >/dev/null 2>&1; then echo "DNS OK (lan $i)"; break; fi
          echo "Dang cho DNS ($i/20)..."; sleep 30
        done
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo -E apt-get -qq update || sudo -E apt-get -qq update
        sudo -E ./devenv/dependencies.sh
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: "Clone OpenWrt source code"
      run: |
        df -hT $PWD
        # FIX4 (2026-11-12): KHONG dung main nua. Main tu 20/10/2026 chi con
        # kernel 6.18, ma target msm89xx cua repo nay ghim KERNEL_PATCHVER:=6.12
        # nen "make defconfig" lang lang bo luon target JZ0145 va roi ve
        # target mac dinh mediatek/filogic (router OpenWrt One) - do la ly do
        # run #4 ra 0 file va run #5 ra firmware MediaTek. Nhanh 25.12 chi co
        # kernel 6.12 va feeds cua no cung khoa theo nhanh 25.12, dung 1 cap.
        git clone --depth=1 --branch "openwrt-25.12" https://git.openwrt.org/openwrt/openwrt.git openwrt

    - name: Load msm89xx target and packages
      run: |
        git apply --unsafe-paths enable_wcn36xx_mac80211.patch
        mv msm89xx openwrt/target/linux/msm89xx
        mv packages openwrt/package/uz801
        if [ "${{ inputs.openwrt_version }}" == "openwrt-24.10" ]; then
          sed -i '/^KERNEL_PATCHVER/c\KERNEL_PATCHVER:=6.6' openwrt/target/linux/msm89xx/Makefile
        fi

    - name: Update and install feeds
      run: |
        cd openwrt
        rm -rf tmp
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: "Load diffconfig"
      run: |
        [ -f diffconfig_jz01 ] && mv diffconfig_jz01 openwrt/.config

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        # GUARD (2026-11-12): neu defconfig lam mat target msm89xx/JZ0145 thi
        # DUNG LAI NGAY (chi mat 2 phut) chu khong build nham 1.5h nhu run #4/#5.
        grep -q '^CONFIG_TARGET_msm89xx=y' .config && grep -q '^CONFIG_TARGET_msm89xx_msm8916_DEVICE_xiaoxun-jz0145-v33=y' .config || { echo "LOI: defconfig da lam mat target msm89xx/JZ0145"; grep '^CONFIG_TARGET' .config | head -5; exit 1; }
        echo "Target OK: msm89xx / xiaoxun-jz0145-v33"
        make download -j8
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        # FIX3 (2026-11-12): copy flash.sh tu repo vao thu muc output de no co
        # mat trong artifact (truoc day no chi nam trong repo, khong nam o day).
        cp $GITHUB_WORKSPACE/msm89xx/image/flash.sh ./openwrt-msm89xx-msm8916-xiaoxun-jz0145-v33-flash.sh 2>/dev/null || echo "flash.sh khong tim thay, bo qua"
        echo "Cac file build ra:"; ls -la
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: openwrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        # FIX3 (2026-11-12): run #4 build xong nhung upload duoc 0 file vi
        # danh sach ten file cu khong khop ten file build ra that (va
        # upload-artifact mac dinh chi canh bao chu khong bao loi). Doi sang
        # wildcard de upload dung file nao build ra, va bao loi neu khong co file.
        if-no-files-found: error
        path: |
          ${{ env.FIRMWARE }}/openwrt-*
